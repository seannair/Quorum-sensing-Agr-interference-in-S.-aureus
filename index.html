<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>S. aureus quorum sensing &amp; Agr interference · teaching animation</title>
<style>
  :root{ --bg:#f4f8fe; }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; background:var(--bg); overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  /* the page NEVER scrolls — everything lives on one screen (see playbook §7 for phone geometry) */
  #stage{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:manipulation; cursor:pointer; }
  /* ---------- interactive chrome (hidden in render mode — captures keep captions + credit) ---------- */
  #ui{ position:fixed; left:0; right:0; bottom:0; z-index:5; padding:8px max(12px, env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom)); display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center;
       background:linear-gradient(rgba(244,248,254,0), rgba(244,248,254,.9) 30%); pointer-events:none; }
  #ui > *{ pointer-events:auto; }
  button{ font-family:inherit; border:none; cursor:pointer; color:#fff; background:linear-gradient(135deg,#3b82f6,#2563eb); padding:9px 16px; min-height:40px; border-radius:11px; font-size:14px; font-weight:600; box-shadow:0 2px 8px rgba(37,99,235,.35); transition:filter .15s, transform .1s; }
  button:hover{ filter:brightness(1.08); } button:active{ transform:scale(.96); }
  #dots{ display:flex; gap:7px; align-items:center; }
  .dot{ width:13px; height:13px; border-radius:50%; background:#c7d4ea; border:none; cursor:pointer; padding:0; transition:.2s; box-shadow:none; min-height:0; }
  .dot.active{ background:#f59e0b; transform:scale(1.28); }
  #speedWrap, #scrubWrap{ display:flex; align-items:center; gap:7px; color:#475569; font-size:13px; font-weight:600; }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:92px; height:5px; border-radius:3px; background:#c7d4ea; outline:none; }
  #scrub{ width:min(38vw,260px); }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:#f59e0b; cursor:pointer; border:2.5px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.3); }
  input[type=range]::-moz-range-thumb{ width:16px; height:16px; border-radius:50%; background:#f59e0b; cursor:pointer; border:2.5px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.3); }
  #prog{ position:fixed; left:0; right:0; bottom:0; height:4px; background:#dbe6f5; z-index:6; }
  #progBar{ height:100%; width:0%; background:linear-gradient(90deg,#f59e0b,#fb7185); }
  body.render-mode #ui, body.render-mode #prog{ display:none; }
  /* chapter caption — HTML pill so it keeps a fixed CSS-px size at any window (scaled SVG text was illegible on phones and overlapped the control bar) */
  #capPill{ position:fixed; left:max(12px, env(safe-area-inset-left)); bottom:calc(64px + env(safe-area-inset-bottom)); z-index:4; max-width:min(592px, calc(100vw - 32px));
       background:#fff; border:1px solid #c7d4ea; border-radius:14px; box-shadow:0 2px 8px rgba(15,23,42,.10); padding:9px 16px; font-size:15px; line-height:1.45; color:#0f172a; pointer-events:none; }
  @media (max-width:560px){ #capPill{ bottom:calc(120px + env(safe-area-inset-bottom)); font-size:14px; max-width:calc(100vw - 32px); } }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Animated diagram of S. aureus Agr quorum sensing: cognate autoinducing peptide AIP-1 activates the two-component system AgrC-AgrA to switch on virulence genes; a non-cognate AIP from another strain then blocks the receptor and silences the response, which recovers when the foreign signal is gone.">
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#e9f1fc"/></linearGradient>
  <radialGradient id="cellGrad" cx=".38" cy=".32" r=".95"><stop offset="0" stop-color="#ffe3b3"/><stop offset=".55" stop-color="#ffb066"/><stop offset="1" stop-color="#f97e2c"/></radialGradient>
  <radialGradient id="miniGrad" cx=".38" cy=".34" r=".9"><stop offset="0" stop-color="#ffe0ad"/><stop offset="1" stop-color="#fb9a45"/></radialGradient>
  <radialGradient id="commGrad" cx=".38" cy=".34" r=".9"><stop offset="0" stop-color="#e2e8f0"/><stop offset=".6" stop-color="#9fb0c7"/><stop offset="1" stop-color="#64748b"/></radialGradient>
  <!-- per-cell coordination halo: opaque coccus covers the centre, so opacity peaks in the mid band (IS256 coatGlow idiom) -->
  <radialGradient id="aipGlow"><stop offset="0" stop-color="#93c5fd" stop-opacity=".45"/><stop offset=".55" stop-color="#60a5fa" stop-opacity=".4"/><stop offset=".85" stop-color="#3b82f6" stop-opacity=".45"/><stop offset="1" stop-color="#3b82f6" stop-opacity=".08"/></radialGradient>
  <pattern id="pgHatch" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0,7 L7,0 M-1,1 L1,-1 M6,8 L8,6" stroke="#f97316" stroke-opacity=".25" stroke-width="1.5"/></pattern>
  <!-- ambient AIP ring glyphs: thiolactone pentagon + tail, the same shape as the biogenesis ring — blue cognate / red non-cognate -->
  <g id="agB"><circle cx="0" cy="-6.5" r="3" fill="#4d7cfe"/><circle cx="6.2" cy="-2" r="3" fill="#4d7cfe"/><circle cx="3.8" cy="5.3" r="3" fill="#4d7cfe"/><circle cx="-3.8" cy="5.3" r="3" fill="#4d7cfe"/><circle cx="-6.2" cy="-2" r="3" fill="#4d7cfe"/><circle cx="9.5" cy="8" r="3" fill="#4d7cfe"/><circle cx="14" cy="10.5" r="3" fill="#4d7cfe"/></g>
  <g id="agR"><circle cx="0" cy="-6.5" r="3" fill="#ef4444"/><circle cx="6.2" cy="-2" r="3" fill="#ef4444"/><circle cx="3.8" cy="5.3" r="3" fill="#ef4444"/><circle cx="-3.8" cy="5.3" r="3" fill="#ef4444"/><circle cx="-6.2" cy="-2" r="3" fill="#ef4444"/><circle cx="9.5" cy="8" r="3" fill="#ef4444"/><circle cx="14" cy="10.5" r="3" fill="#ef4444"/></g>
</defs>

<rect x="-2000" y="-2000" width="7600" height="4800" fill="url(#bgGrad)"/>

<!-- ================= TITLE (copyright line is byte-exact — copyright-credit skill; never move/animate it) ================= -->
<g id="titleG">
  <text x="800" y="44" text-anchor="middle" font-size="31" font-weight="800" fill="#1e293b" letter-spacing=".2">Quorum sensing &amp; Agr interference in <tspan font-style="italic">S. aureus</tspan></text>
  <text x="800" y="71" text-anchor="middle" font-size="16.5" fill="#64748b">Cells grow; AIP-1 accumulates in the shared medium until it crosses a threshold and flips the AgrC–AgrA switch — then a foreign, non-cognate AIP silences it</text>
  <text x="26" y="98" font-size="13" fill="#a3aec0" font-family="'Segoe Script','Brush Script MT','Comic Sans MS',cursive">© Sean P Nair</text>
</g>

<!-- ================= LEGEND (built by JS from the LEGEND array below) ================= -->
<g id="legendG" font-size="13" fill="#475569"></g>

<!-- ============================================================ -->
<!-- TOPIC SCENE — replace everything between these markers wholesale.   -->
<!-- Rules: every element render(t) touches gets an id; all state is set  -->
<!-- per frame (cx/cy/transform for position, opacity via setOp); nothing -->
<!-- accumulates across frames. Layout: keep clear of y<110 (title +     -->
<!-- legend zone) and y>800 (fixed UI strip — anything below collides).  -->
<!-- ============================================================ -->
<g id="scene">
  <!-- ================= GENE BAND (top strip) — agrBDCA operon, P2 + P3 promoters ================= -->
  <line x1="100" y1="205" x2="1160" y2="205" stroke="#b9c7de" stroke-width="9" stroke-linecap="round"/>
  <rect x="145" y="182" width="10" height="46" fill="#f59e0b"/>
  <text x="150" y="176" font-size="13.5" font-weight="800" fill="#b45309">P2</text>
  <!-- gene arrows: P→N, height 46 (y182..228), italic white labels centred -->
  <g id="geneB"><path d="M180,182 h126 l54,23 l-54,23 h-126 z" fill="#4d7cfe"/><text x="270" y="212" text-anchor="middle" font-size="16.5" font-weight="700" font-style="italic" fill="#fff">agrB</text></g>
  <g id="geneD"><path d="M380,182 h126 l54,23 l-54,23 h-126 z" fill="#4d7cfe"/><text x="470" y="212" text-anchor="middle" font-size="16.5" font-weight="700" font-style="italic" fill="#fff">agrD</text></g>
  <g id="geneC"><path d="M620,182 h116 l48,23 l-48,23 h-116 z" fill="#4d7cfe"/><text x="705" y="212" text-anchor="middle" font-size="16.5" font-weight="700" font-style="italic" fill="#fff">agrC</text></g>
  <g id="geneA"><path d="M810,182 h116 l48,23 l-48,23 h-116 z" fill="#4d7cfe"/><text x="895" y="212" text-anchor="middle" font-size="16.5" font-weight="700" font-style="italic" fill="#fff">agrA</text></g>
  <rect x="1005" y="182" width="10" height="46" fill="#f59e0b"/>
  <text x="1010" y="176" font-size="13.5" font-weight="800" fill="#b45309">P3</text>
  <g id="viruPill"><rect x="1028" y="248" width="152" height="34" rx="17" fill="#dcfce7" stroke="#4ade80"/><text x="1104" y="270" text-anchor="middle" font-size="14.5" font-weight="800" fill="#15803d">P3 virulence</text></g>
  <text id="viruSub" x="1100" y="302" text-anchor="middle" font-size="12.5" fill="#64748b">hla · PVL (lukSF-PV) · TSST-1</text>

    <rect id="recRect" x=562 y=331 width=58 height=56 rx=12 fill="#8b5cf6"/>
    <text x=591 y=364 text-anchor="middle" font-size="15.5" font-weight="800" fill="#fff">AgrC</text>
  </g>
  <g id="dockBlueG"><circle cx=614 cy=336 r=8.5 fill="#4d7cfe"/><circle cx=614 cy=336 r=3.2 fill="#fff"/></g>

  <rect x=459 y=294 width=42 height=42 rx=10 fill="#ede9fe"/><rect x=465 y=300 width=30 height=30 rx=8 fill="#8b5cf6"/>

  <!-- ================= INSET A: AIP structure — thiolactone macrocycles (top-right, persistent; mirrors the deck's four-group figure) ================= -->
  <rect x=1200 y=192 width=330 height=188 rx=16 fill="#fff" opacity=".9" stroke="#c7d4ea"/>
  <text x=1365 y=209 text-anchor="middle" font-size="15.5" font-weight="800" fill="#334155">AIP structure — thiolactone macrocycles</text>
  <text x=1285 y=224 text-anchor="middle" font-size="11" fill="#94a3b8">(cognate)</text>

  <!-- AIP-I (blue, cognate) -->
  <g transform="translate(1285,252)">
    <path d="M-13.3,-4.3 Q0,-27 13.3,-4.3" fill="none" stroke="#4d7cfe" stroke-width="2"/>
    <text x="-19" y="-6" font-size="9" fill="#475569">S</text><text x="6" y="-29" font-size="9" fill="#475569">O</text>

    <circle cx="13.3" cy="-4.3" r="6.5" fill="#4d7cfe"/><circle cx="15" cy="16" r="5.5" fill="#4d7cfe"/><circle cx="21" cy="19" r="5.5" fill="#4d7cfe"/>
    <text x="0" y="40" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">AIP-I</text>
  </g>
  <!-- AIP-IV (light blue — interchangeable with I) -->
  <g transform="translate(1285,310)">
    <path d="M-13.3,-4.3 Q0,-27 13.3,-4.3" fill="none" stroke="#93b4fd" stroke-width="2"/>

<script>
"use strict";
/* ============================================================
   TOPIC — deterministic teaching animation (starter scaffold).
   Every visual state is a pure function of t (seconds, 0..D).
   URL modes: ?t=<sec> seek-at-boot + freeze · ?render=1 capture mode
   (hides interactive chrome only) · ?test=1 self-test badge.
   Seam rule: frame(D-eps) must equal frame(0) — chapter 0 starts in
   steady state and the last chapter returns everything home.
   ============================================================ */

const D = 48;                 // loop duration (s) — five ×9.6 s chapters, seamless: frame(D-eps) == frame(0)
const CH = [0, 9.6, 19.2, 28.8, 38.4];   // chapter starts — SILENCE / GROWTH / QUORUM ON / INVASION→SILENT / RECOVERY & RESET
const CAPTIONS = [            // one [titleLine, bodyLine] per chapter (numbered 1–5; <b> stage name, <i> gene/species names)
  ["<b>1 · SILENCE</b> — too few cells","A sparse culture: each cell makes its AIP-1 signal, but at low density the peptide is diluted below threshold, so <i>AgrC</i> stays unphosphorylated and the <i>P3</i> virulence genes remain off (red X)."],
  ["<b>2 · GROWTH &amp; ACCUMULATION</b> — as the culture grows","Cells divide on the left and AIP-1 (blue) builds up in the shared medium until it crosses the threshold — the population is counting itself. <i>AgrC</i> hands a phosphate to <i>AgrA</i>, which fires <i>P3</i>."],
  ["<b>3 · QUORUM ON</b> — the autocatalytic loop","Active <i>AgrA~P</i> switches on the virulence genes at <i>P3</i> and re-switches on its own operon at <i>P2</i> — an autocatalytic loop. Inside the cell, <i>AgrD</i> makes a signal propeptide that <i>AgrB</i> cleaves and cyclises into mature AIP-1, which is exported to the medium. On X-gal plates, the P3-lacZ reporter turns blue."],
  ["<b>4 · INVASION → SILENT</b>","A skin commensal grows in on the right and floods the medium with its own, non-cognate AIP (red — e.g. group II). It out-competes AIP-1 for <i>AgrC</i> and acts as an antagonist: even at high density the virulence genes stay off and the colonies stay colourless."],
  ["<b>5 · RECOVERY &amp; RESET</b>","When the foreign signal clears, cognate AIP-1 re-binds <i>AgrC</i> and the loop refires. Then dilution — growth into fresh medium — pushes AIP below threshold again: back to silence, exactly where we started."]
];
const LEGEND = [              // colour key — [fill, label] (X-gal blue is labelled inside its own inset)
  ["#4d7cfe","AIP-1 — cognate autoinducer"],
  ["#ef4444","non-cognate AIP — foreign signal"],
  ["#8b5cf6","AgrC receptor · AgrA regulator"],
  ["#94a3b8","skin commensal cell"],
  ["#fbbf24","phosphate badge — active AgrA~P"],
  ["#14b8a6","AgrB — AIP maturation/exporter"]
];

/* ---------- helpers (engine — do not edit) ---------- */
const $ = id => document.getElementById(id);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const seg = (t,a,b)=>clamp((t-a)/(b-a),0,1);
const easeIO = t=> t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const easeO  = t=> 1-Math.pow(1-t,3);
function setOp(el,f){ if(f==null) return; el.setAttribute("opacity", f.toFixed(3)); }
const chapterOf = t => { for(let i=CH.length-1;i>=0;i--) if(t>=CH[i]) return i; return 0; };

/* ---------- params / modes (engine — do not edit) ---------- */
const P = new URLSearchParams(location.search);
let renderMode = P.get("render")==="1";
let testMode   = P.get("test")==="1";
let seekT      = P.has("t") ? clamp(parseFloat(P.get("t"))||0, 0, D-0.001) : null;

/* ---------- build legend (engine — width formula is tspan-safe; adjust wrap point to taste) ---------- */
(function buildLegend(){
  const g = $("legendG"); let x=1000, y=106;
  for(const [c,label] of LEGEND){
    const w = label.replace(/<[^>]*>/g,"").length*7.4 + 34;   // width from visible text (italic tspan-safe)
    if(x+w>1540){ x=1000; y+=22; }
    g.innerHTML += `<rect x="${x}" y="${y-15}" width="${w}" height="24" rx="12" fill="#ffffff" opacity=".82"/>`+
      `<circle cx="${x+15}" cy="${y-3}" r="7" fill="${c}"/>`+
      `<text x="${x+29}" y="${y+2}" font-size="13" fill="#475569">${label}</text>`;
    x += w + 10;
  }
})();

/* ---------- per-frame state (exposed for ?test=1 and external capture) ---------- */
const S = {};

function render(t){
  t = ((t % D) + D) % D;
  const ch = chapterOf(t);

  /* ============================================================ */
  /* SCENE LOGIC — every value derived from t alone (pure fn).     */
  /* SILENCE(below threshold) → GROWTH(AIP accumulates, crosses   */
  /* threshold mid-chapter) → QUORUM ON(autocatalytic loop +       */
  /* biogenesis) → INVASION→SILENT(foreign AIP blocks AgrC) →     */
  /* RECOVERY & RESET(refire, then dilution back to the opening   */
  /* state so frame(D-eps) == frame(0)).                           */
  /* ============================================================ */
  let blue, red, on, density;
  if(ch===0){ blue=15; red=0; on=0; density=.35; }                                                    // SILENCE: sparse culture below threshold
  else if(ch===1){ blue=15+70*easeIO(seg(t,9.6,18)); red=0; on=easeIO(seg(t,13.7,17.6)); density=.35+.65*easeIO(seg(t,9.6,17)); } // GROWTH → 85/0/1
  else if(ch===2){ blue=85; red=0; on=1; density=1; }                                                  // QUORUM ON: autocatalytic plateau
  else if(ch===3){ blue=85-15*easeIO(seg(t,30,34)); red=95*easeIO(seg(t,29.5,33)); on=1-easeIO(seg(t,31.5,34)); density=1; } // INVASION → 70/95/0
  else { const r=easeIO(seg(t,42,44)), d=easeIO(seg(t,45.6,47.6));                                     // RECOVERY & RESET: refire, then dilution home
    blue=70+15*r-70*d; red=95*(1-easeIO(seg(t,39.5,42))); on=r*(1-d); density=1-.65*easeIO(seg(t,45.2,47.4)); }
  const thrCross = Math.exp(-Math.pow((t-13.8)/0.5,2));   // gaussian flash as AIP crosses the threshold (~t=13.8)
  const redOcc = seg(t,30.5,32.5)*(1-seg(t,40.5,42));     // foreign AIP occupancy of the AgrC site (seam-safe: 0 at t=0 and t=D)

  /* gene band stays constant brightness; virulence pill dims (0.35) when silent, lit (1.0) when quorum is on */
  const geneLit = .35+.65*on;
  setOp($("viruPill"), geneLit); setOp($("viruSub"), geneLit);
  setOp($("xMark"), (1-on)*.95);   // red X over the virulence genes while P3 is off

  /* transcription flow: marching-dash mRNA strand along the operon + dashed arrows — speed·D = 480 = 24×20 (period) → seam-safe */
  const dashOff = -(t*10 % 20);
  for(const id of ["loopPath","viruPath"]){ setOp($(id), on*.95); $(id).setAttribute("stroke-dashoffset", dashOff.toFixed(2)); }
  $("txPath").setAttribute("stroke-dasharray","12 8"); $("txPath").setAttribute("stroke-dashoffset", dashOff.toFixed(2));
  setOp($("txPath"), on*.95); setOp($("txLbl"), on*.9);

  /* AgrA~P badge; receptor dims while the foreign AIP occupies its site */
  setOp($("phosBadge"), on);

  /* receptor occupancy across the five AgrC sites — staggered thresholds so binding fills in as blue accumulates and red displaces it (pure fn of blue/red → seam-safe) */
  const BT=[20,36,52,68,84], RT=[15,35,55,75,92]; let bound=0;
  for(let i=0;i<5;i++){
    const b=easeIO(seg(blue,BT[i]-6,BT[i]+6)), r=easeIO(seg(red,RT[i]-8,RT[i]+8));
    if(i===0){ setOp($("dockBlueG"), b*(1-r)); setOp($("dockRedG"), r); $("recRect").setAttribute("fill-opacity",(1-.55*r).toFixed(3)); }
    else { setOp($("db"+i), b*(1-r)); setOp($("dr"+i), r); }
    if(b*(1-r)>.5) bound++;
  }

  /* AgrB export pulse — cos period 8 s divides D=48 → seam-safe */
  $("pulseRing").setAttribute("r", (9+5*(0.5-0.5*Math.cos(2*Math.PI*t/8))).toFixed(2));
  setOp($("pulseRing"), .6*on);

  /* AIP biogenesis: AgrD pro-peptide → AgrB matures it to the ring-AIP and exports it */
  const bioVis = clamp((blue-12)/25,0,1)*(1-redOcc);
  if(bioVis>0.01){
    const q=((t/4.8)%1+1)%1;   // 4.8 s cycle divides D=48 → seam-safe
    if(q<.4){ const p=easeIO(q/.4); setOp($("bioProG"), bioVis*seg(q,0,.06)*(1-seg(q,.32,.4)));
      $("bioProG").setAttribute("transform", `translate(${(525-147*p).toFixed(2)},${(532+46*p).toFixed(2)}) rotate(162.7)`); }
    else setOp($("bioProG"), 0);
    if(q>=.4 && q<.9){ const p=easeIO((q-.4)/.5); setOp($("bioRingG"), bioVis*seg(q,.4,.46)*(1-seg(q,.7,.9)));
      $("bioRingG").setAttribute("transform", `translate(${(378-48*p).toFixed(2)},${(578+46*p).toFixed(2)}) scale(${(.5+.5*seg(q,.4,.55)).toFixed(3)})`); }
    else setOp($("bioRingG"), 0);
  } else { setOp($("bioProG"), 0); setOp($("bioRingG"), 0); }
  const lblW = seg(bioVis,.35,.7)*.9;                                  // fade labels in/out with the biogenesis scene (no ghost at SILENCE, where bioVis≈0.12)
  setOp($("bioLblA"), lblW); setOp($("bioLblB"), lblW);

  /* population (left of cell): cocci split away from the cluster core as density rises; halos light up at quorum */
  const MX=[262,200,324,228,296,262,172,340], MY=[545,592,592,660,660,610,532,532];
  const PCX=262, PCY=585;   // cluster core — new cocci drift outward from here while scaling in (division feel)
  for(let i=0;i<8;i++){
    const s=easeO(clamp((8*density-(i+.75))/.25,0,1));
    const k=(1-s)*.45;
    $("m"+i).setAttribute("transform", `translate(${(MX[i]-(MX[i]-PCX)*k).toFixed(2)},${(MY[i]-(MY[i]-PCY)*k).toFixed(2)}) scale(${s.toFixed(3)})`);
    setOp($("mh"+i), .5*on*s);
  }

  /* skin commensal slides in for the invasion chapter, divides into two daughters while it grows, out again before the seam */
  const cin=seg(t,29,31), cOut=seg(t,38.6,40.2);
  $("commG").setAttribute("transform", `translate(${((1-cin)*150+cOut*150).toFixed(2)},0)`);
  setOp($("commG"), Math.min(cin,1-cOut));
  const d1=easeO(seg(t,31.6,33.4))*(1-cOut), d2=easeO(seg(t,32.6,34.6))*(1-cOut);   // daughters split away from the parent; scale back out on the exit window (pure fn of t → seam-safe)
  setOp($("commD1"), d1); setOp($("commD2"), d2);
  $("commD1").setAttribute("transform", `translate(${(1046-70*d1).toFixed(2)},${(592+38*d1).toFixed(2)}) scale(${d1.toFixed(3)})`);
  $("commD2").setAttribute("transform", `translate(${(1046+62*d2).toFixed(2)},${(592+42*d2).toFixed(2)}) scale(${d2.toFixed(3)})`);

  /* ambient AIP field: blue ring glyphs appear one-by-one as the gauge rises; red ones are produced at the commensal and drift out (pure fn of red → seam-safe) */
  const BX=[240,352,900,1120,690,985], BY=[330,428,724,724,700,290], PER=[8,12,6,8,12,6];  // all periods divide D=48 → seam-safe
  for(let i=0;i<6;i++){
    const a = 2*Math.PI*t/PER[i]*(i%2?-1:1);
    $("bd"+i).setAttribute("transform", `translate(${(BX[i]+8*Math.cos(a)).toFixed(2)},${(BY[i]+8*Math.sin(a)).toFixed(2)})`);
    setOp($("bd"+i), easeIO(seg(blue, 9+i*13, 22+i*13)));
  }
  const RT0=[8,26,44,62,80], RX=[700,950,1150,770,1060], RY=[300,480,600,668,300];   // staggered production + field targets
  for(let i=0;i<5;i++){
    const p=easeIO(seg(red, RT0[i], RT0[i]+25));
    $("rd"+i).setAttribute("transform", `translate(${(1046+(RX[i]-1046)*p).toFixed(2)},${(592+(RY[i]-592)*p).toFixed(2)})`);
    setOp($("rd"+i), easeIO(seg(red, RT0[i], RT0[i]+12)));
  }

  /* three-way state gating (chips + gauge states) — no garbled crossfade */
  const sB=clamp((redOcc-.3)/.4,0,1);
  const belowW=clamp((.4-on)/.4,0,1)*(1-clamp((redOcc-.2)/.3,0,1));
  setOp($("chipOnG"), on); setOp($("chipOffG"), sB*(1-on)); setOp($("chipBelowG"), belowW);
  setOp($("xgalBlueG"), on); setOp($("xgalPaleG"), 1-on);
  setOp($("xgalTxtA"), on); setOp($("xgalTxtB"), 1-on);

  /* gauge + threshold flash + structure-panel highlights */
  $("gaugeBlueFill").setAttribute("width", (270*blue/100).toFixed(1));
  $("gaugeRedFill").setAttribute("width", (270*red/100).toFixed(1));
  setOp($("thrFlash"), thrCross*.9);
  setOp($("recStateA"), on); setOp($("recStateB"), sB*(1-on)); setOp($("recStateC"), belowW);
  setOp($("hlCog"), (1-redOcc)*.95);
  setOp($("hlNon"), redOcc*.95);

  /* caption pill (engine — do not edit) */
  const cap = $("capPill"), ck = ch+"|"+CAPTIONS[ch][0].length;
  if(cap.dataset.k!==ck){ cap.dataset.k=ck; cap.innerHTML = CAPTIONS[ch][0]+"<br>"+CAPTIONS[ch][1]; }
  setOp($("titleG"), .98);

  S.t=t; S.chapter=ch;
  S.blue=+blue.toFixed(1); S.red=+red.toFixed(1); S.on=+on.toFixed(2); S.density=+density.toFixed(2);
  S.bound=bound; S.redOcc=+redOcc.toFixed(2); S.xgal = on>.5?1:0;
  S.comm=+Math.max(d1,d2).toFixed(2);   // commensal daughter growth (seam-checked)
}

/* ---------- self-test (?test=1) — TOPIC: replace checks with assertions about YOUR scene, keep the seam block ---------- */
function runSelfTest(){
  const checks=[
    [4,     s=>s.chapter===0 && Math.abs(s.blue-15)<.5 && s.red<.5 && s.on<.02 && Math.abs(s.density-.35)<.02 && s.bound===0 && s.comm<.01], // silence: below threshold (seam anchor)
    [13,    s=>s.chapter===1 && s.blue>25 && s.blue<60 && s.on<.1],              // growth: AIP accumulating toward the threshold
    [14,    s=>s.chapter===1 && s.blue>30 && s.bound>=2],                        // mid-growth: several AgrC sites occupied by cognate AIP
    [15,    s=>s.chapter===1 && s.blue>60 && s.on>.1 && s.on<.5],                // just crossed — quorum igniting
    [18.5,  s=>s.blue>84 && s.on>.99 && s.density>.99],                          // ignition complete: full density above threshold
    [24,    s=>s.chapter===2 && Math.abs(s.blue-85)<.5 && s.red<.5 && s.on>.99], // quorum on: autocatalytic plateau
    [33.5,  s=>s.chapter===3 && s.comm>.9],                                      // invasion: commensal has divided (daughters grown in)
    [34.2,  s=>s.chapter===3 && s.red>90 && s.on<.05 && s.xgal===0],             // invaded: non-cognate AIP blocks AgrC — silent at high density
    [41,    s=>s.chapter===4 && s.red<30 && s.on<.1],                            // recovery: foreign signal washing out
    [43.6,  s=>s.on>.9 && Math.abs(s.blue-85)<2],                                // refired before the dilution beat
    [47.8,  s=>Math.abs(s.blue-15)<.5 && s.red<.5 && s.on<.02 && Math.abs(s.density-.35)<.02 && s.bound===0 && s.comm<.01] // reset: back to the opening state
  ];
  let ok=true; const fails=[];
  for(const [t,pred] of checks){ render(t); if(!pred(S)) {ok=false; fails.push(`t=${t}: state=${JSON.stringify(S)}`);} }
  /* seam: last frame ≈ first frame (visual state only) — snap() whatever the eye sees */
  const snap = () => ({blue:S.blue, red:+S.red.toFixed(0), on:+S.on.toFixed(2), density:+S.density.toFixed(2), bound:S.bound, redOcc:+S.redOcc.toFixed(2), xgal:S.xgal, comm:+S.comm.toFixed(2)});
  render(D-0.02); const a=snap();
  render(0.02);   const b=snap();
  if(Math.abs(a.blue-b.blue)>1||Math.abs(a.red-b.red)>2||Math.abs(a.on-b.on)>.05||Math.abs(a.density-b.density)>.05||a.bound!==b.bound||Math.abs(a.redOcc-b.redOcc)>.05||a.xgal!==b.xgal||Math.abs(a.comm-b.comm)>.05){ ok=false; fails.push(`seam mismatch ${JSON.stringify({end:a,start:b})}`); }
  document.body.dataset.selftest = ok?"PASS":"FAIL";
  $("badge").textContent = `self-test: ${ok?"PASS":"FAIL"}`+(fails.length? " — "+fails[0]:"");
  return {ok, fails};
}

/* ---------- interaction / loop (engine — do not edit) ---------- */
let speed=1, last=null;
const playBtn=$("playBtn"), dotsG=$("dots");
for(const start of CH){ const d=document.createElement("button"); d.className="dot"; d.type="button";
  d.addEventListener("click",e=>{ e.stopPropagation(); seek(start+0.01); }); dotsG.appendChild(d); }

function seek(t){ if(seekT!=null) return; curT=clamp(t,0,D-0.001); render(curT); last=null; syncUI(curT); }  // R13: set curT BEFORE rendering
function syncUI(t){
  const ch = chapterOf(t);
  [...dotsG.children].forEach((d,i)=>d.classList.toggle("active",i===ch));
  $("progBar").style.width=(t/D*100).toFixed(2)+"%";
  if(!scrubbing) scrub.value = t.toFixed(2);
  tVal.textContent = t.toFixed(1)+"s";
}
playBtn.addEventListener("click",e=>{ e.stopPropagation(); playing=!playing; playBtn.textContent=playing?"⏸ Pause":"▶ Play"; last=null; });
const scrub=$("scrub"), tVal=$("tVal"); let scrubbing=false;
scrub.max = (D-0.02).toFixed(2);
scrub.addEventListener("pointerdown",()=>{ scrubbing=true; });
window.addEventListener("pointerup",()=>{ scrubbing=false; });
scrub.addEventListener("input",e=>{ e.stopPropagation(); seek(parseFloat(scrub.value)); });
$("spd").addEventListener("input",()=>{ speed=parseFloat($("spd").value); $("spdVal").textContent=speed.toFixed(1)+"×"; });
if(!renderMode) $("stage").addEventListener("pointerdown",e=>{ if(e.target.closest("#ui")) return; playing=!playing; playBtn.textContent=playing?"⏸ Pause":"▶ Play"; last=null; });

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
/* frozen frame in capture/test mode and when an explicit ?t= is given (play button still starts it) */
let playing = !(renderMode || testMode) && seekT==null && !reduce;
playBtn.textContent = playing?"⏸ Pause":"▶ Play";

let curT = seekT!=null ? seekT : 0;
function frame(ts){
  if(playing && last!=null){ curT=(curT+(ts-last)/1000*speed)%D; render(curT); syncUI(curT); } else { last=null; }
  last=ts; requestAnimationFrame(frame);
}

/* ---------- boot (engine — do not edit) ---------- */
if(renderMode) document.body.classList.add("render-mode");
render(curT); syncUI(curT);
if(testMode){ const r=runSelfTest(); console.log(r.ok?"SELF-TEST PASS":"SELF-TEST FAIL", r.fails||""); }
requestAnimationFrame(frame);
window.__AGRQS = { render, D, state:()=>S };   // handle for external frame capture (_capture.mjs)
</script>
